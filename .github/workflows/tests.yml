# Runs the tests on every pull request and on every push to main.
#
# The same Python, packages and command as the test step of a release (release.yml), so what passes here
# passes there. The tests that run DeepCool's firmware in the emulator are skipped: its image is not in
# this repository, and they run on a PC that has DeepCool's app.
#
# A pull request from a fork runs with a token that can only read, and with no secrets.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:                 # a newer push to the same branch or pull request ends the run of the older one
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,package]"

      - name: Test
        run: python -m pytest -q
